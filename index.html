<style>
:root{--red:#e8262d;--red2:#ff3b3b;--txt:#fff;--mut:#c9bcbc;--line:rgba(232,38,45,.35)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0304;overscroll-behavior:none}
body{font-family:Montserrat,system-ui,sans-serif;color:var(--txt);overflow:hidden}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;
 background:radial-gradient(ellipse at 50% 22%,#3b0a0d 0%,#1a0507 48%,#0b0304 100%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px);
 overflow-y:auto;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;opacity:0;transform:translateX(40px);pointer-events:none}
.screen.on{opacity:1;transform:none;pointer-events:auto}
.screen.left{transform:translateX(-40px)}
/* splash */
#splash{align-items:center;justify-content:center;z-index:5;background:#0b0304;transition:opacity .5s}
#splash .logo{width:180px;animation-fill-mode:both;border-radius:50%;will-change:transform,rotate;backface-visibility:hidden;animation:pop 1s cubic-bezier(.2,1.4,.4,1) both, spin 1.4s .1s ease-out both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{from{rotate:-180deg}to{rotate:0deg}}
/* welcome */



@media (min-width:438px){}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:clamp(8px,5vh,56px)}
.hero .logo{width:min(200px,50vw,26vh);filter:drop-shadow(0 0 22px rgba(232,38,45,.55)) drop-shadow(0 8px 14px rgba(0,0,0,.8))}
.title{font-family:'Margarine',Impact,sans-serif;font-size:clamp(58px,19vw,84px);line-height:.95;color:#ee2b31;margin-top:-10px;transform:rotate(-5deg);letter-spacing:1px;text-shadow:0 0 22px rgba(232,38,45,.45),0 5px 0 #4a080b,0 10px 18px rgba(0,0,0,.8)}
.tag{margin-top:12px;font-weight:800;letter-spacing:2px;font-size:14px;color:#e6e0e0;transform:rotate(-5deg);text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:20px}
@media (max-height:760px){.item{padding:12px 14px}.item .ic{width:28px;height:28px}.txt small{font-size:11.5px}.hero{margin-top:4px}}
.item{display:flex;align-items:center;gap:16px;padding:16px;border-radius:16px;cursor:pointer;width:100%;text-align:left;font:inherit;color:#fff;
 background:linear-gradient(180deg,rgba(60,14,16,.75),rgba(20,6,7,.85));border:1px solid var(--line);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 18px rgba(232,38,45,.12);transition:.15s}
.item:active{transform:scale(.98);border-color:var(--red2);box-shadow:0 0 26px rgba(232,38,45,.4)}
.item .ic{width:32px;height:32px;flex:none}
.txt{flex:1;min-width:0}.txt b{display:block;font-weight:800;font-size:14.5px;letter-spacing:.3px;text-transform:uppercase}
.txt small{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.chev{width:12px;opacity:.8;flex:none}
/* inner screens */
.top{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.back{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(40,10,12,.7);color:#fff;display:grid;place-items:center;cursor:pointer}
.top h2{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.lead{color:var(--mut);font-size:14px;line-height:1.5;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;background:rgba(20,6,7,.85);padding:0 14px;margin-bottom:16px;transition:.15s}
.field:focus-within{border-color:var(--red2);box-shadow:0 0 18px rgba(232,38,45,.3)}
.field input,.field select{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:600 16px Montserrat,sans-serif;padding:15px 0}
.field select{flex:none;width:auto;appearance:none;padding-right:4px}
.field select option{background:#1a0507}
.field .sep{width:1px;height:24px;background:var(--line)}
.eye{background:none;border:0;color:var(--mut);font:700 12px Montserrat;cursor:pointer;padding:6px}
.err{color:#ff7a7a;font-size:13px;min-height:18px;margin:-8px 0 12px}
.btn{width:100%;padding:17px;border-radius:14px;border:0;font:800 15px Montserrat,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#fff;cursor:pointer;
 background:linear-gradient(180deg,#ff3b3b,#c3161c);box-shadow:0 8px 24px rgba(232,38,45,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:.15s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;box-shadow:none}
.btn.ghost{background:none;border:1px solid var(--line);box-shadow:none;margin-top:12px}
.link{background:none;border:0;color:var(--red2);font:700 13px Montserrat;cursor:pointer;margin:4px 0 20px;align-self:flex-end}
.spacer{flex:1;min-height:20px}
.otp{display:flex;gap:8px;justify-content:space-between;margin-bottom:12px}
.otp input{width:100%;aspect-ratio:1/1.15;max-width:56px;text-align:center;font:800 24px Montserrat;color:#fff;border-radius:12px;border:1px solid var(--line);background:rgba(20,6,7,.85);outline:0}
.otp input:focus{border-color:var(--red2);box-shadow:0 0 16px rgba(232,38,45,.35)}
.resend{font-size:13px;color:var(--mut);text-align:center;margin:10px 0}
.resend button{background:none;border:0;color:var(--red2);font:700 13px Montserrat;cursor:pointer}
.lang{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;border:1px solid var(--line);background:rgba(20,6,7,.85);margin-bottom:10px;cursor:pointer;width:100%;color:#fff;font:600 16px Montserrat;text-align:left}
.lang .flag{font-size:24px}.lang .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.lang.sel{border-color:var(--red2);box-shadow:0 0 18px rgba(232,38,45,.25)}.lang.sel .ck{background:var(--red);border-color:var(--red)}
/* home */
.welcome{text-align:center;margin-top:30px}
.welcome .logo{width:130px;margin-bottom:18px}
.welcome h1{font-size:24px;font-weight:800}.welcome p{color:var(--mut);margin-top:8px;font-size:14px}
.badge{display:inline-block;margin-top:14px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);font-size:12px;font-weight:700;color:#ffb3b3}
/* toast + spinner */
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite;vertical-align:-3px}
@keyframes r{to{transform:rotate(360deg)}}

.cards{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.card{position:absolute;left:50%;--w:min(128vw,58vh,540px);width:var(--w);height:calc(var(--w)*1.4);top:calc(92% - var(--w)*1.4);margin-left:calc(var(--w)/-2);transform-origin:50% 100%;border-radius:24px;overflow:hidden;background:linear-gradient(155deg,#3b2f31 0%,#221a1b 45%,#120d0e 100%);border:1.5px solid rgba(255,70,70,.4);box-shadow:-12px 0 40px rgba(0,0,0,.75),0 0 24px rgba(232,38,45,.12),inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 50px rgba(0,0,0,.35);color:#060404;text-shadow:0 1px 0 rgba(255,255,255,.09),0 -1px 0 rgba(0,0,0,.7)}
.card i{position:absolute;left:7%;top:3.5%;font:800 calc(var(--w)*.1)/0.95 Montserrat,sans-serif;font-style:normal;text-align:center}
.card i.r{left:auto;right:7%}
.card b{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.5);opacity:.6}
.card.rd{color:#8e1a1f;text-shadow:0 0 12px rgba(232,38,45,.25),0 -1px 0 rgba(0,0,0,.7)}.card{border-color:rgba(255,70,70,.4)}
.c1{transform:rotate(-24deg) translateX(-12%)}.c2{transform:rotate(-8deg) translateX(-5%)}.c3{transform:rotate(8deg) translateX(5%)}.c4{transform:rotate(24deg) translateX(12%)}
#welcome::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
 background:radial-gradient(ellipse at 50% 25%,rgba(11,3,4,0) 0%,rgba(11,3,4,.1) 65%,rgba(11,3,4,.5) 100%)}
.hero,.menu{z-index:2}
.item{background:linear-gradient(180deg,rgba(50,12,14,.62),rgba(16,5,6,.72));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

.bio{position:relative;align-self:center;width:150px;height:150px;border-radius:50%;border:2px solid var(--line);background:radial-gradient(circle,rgba(232,38,45,.18),rgba(20,6,7,.9) 70%);color:#ff4d52;cursor:pointer;overflow:hidden;box-shadow:0 0 40px rgba(232,38,45,.25);transition:.2s}
.bio svg{width:78px;height:78px}
.bio .scan{position:absolute;left:0;right:0;height:3px;top:0;background:#ff3b3b;box-shadow:0 0 14px #ff3b3b;opacity:0}
.bio.on .scan{opacity:1;animation:sc 1.2s ease-in-out infinite}.bio.on{border-color:#ff3b3b}
.bio.ok{border-color:#3ddc84;color:#3ddc84;box-shadow:0 0 40px rgba(61,220,132,.35)}
@keyframes sc{0%{top:10%}50%{top:88%}100%{top:10%}}
.bioTxt{text-align:center;margin-top:18px;font-weight:700;letter-spacing:.5px;color:var(--mut)}
/* compact menu, no scroll */
#welcome{overflow:hidden}
.menu{gap:8px!important}
.item{padding:10px 14px!important;gap:12px!important;border-radius:14px!important}
.item .ic{width:24px!important;height:24px!important}
.txt b{font-size:12.5px!important}
.txt small{font-size:11px!important;margin-top:2px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:9px!important}
.hero .logo{width:min(200px,50vw,24vh)!important}
.title{font-size:clamp(46px,min(19vw,9.5vh),84px)!important}

/* brand block */
.brand{display:flex;flex-direction:column;align-items:center;transform:rotate(-5deg);margin-top:-4px}
.brand .sub{font-family:'BeBrush','Margarine',Impact,sans-serif;color:#fff;font-size:clamp(17px,min(5.6vw,2.9vh),26px);letter-spacing:1.5px;line-height:1;
 text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 12px rgba(0,0,0,.6);margin-bottom:-2px}
.title{font-family:'BeBrush','Margarine',Impact,sans-serif!important;transform:none!important;margin-top:0!important}
.tag{display:inline-block;margin-top:14px!important;padding:9px 18px;border-radius:14px;font-size:12.5px!important;
 background:linear-gradient(180deg,rgba(50,12,14,.62),rgba(16,5,6,.72));border:1px solid var(--line);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 18px rgba(232,38,45,.12);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

/* red glass: base 30% opacity (70% transparent), intensity radiating to corners */
.item,.tag{
 background:

  hi:"Hola, ",hLead:"Todo listo para entrenar PLO.",via:"Conectado vía ",start:"Empezar",logout:"Salir",langSaved:"Idioma actualizado"}
};
const LANGS=[["pt","🇧🇷","Português"],["en","🇺🇸","English"],["es","🇪🇸","Español"]];
const MEM={};const store={get(k){try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return k in MEM?MEM[k]:null},set(k,v){MEM[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){delete MEM[k];try{localStorage.removeItem(k)}catch(e){}}};
const $=s=>document.querySelector(s);
const H={push(o){try{history.pushState(o,"")}catch(e){}},rep(o){try{history.replaceState(o,"")}catch(e){}}};
let lang=store.get("wraps.lang")||((navigator.language||"pt").slice(0,2) in I18N?(navigator.language||"pt").slice(0,2):"pt");
const t=k=>I18N[lang][k]||k;

// logos
const tpl=$("#logoTpl").innerHTML;document.querySelectorAll("[data-logo]").forEach(e=>e.outerHTML=tpl);

function applyLang(){document.documentElement.lang=lang==="pt"?"pt-BR":lang;
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 $("#langList").innerHTML=LANGS.map(([c,f,n])=>`<button class="lang ${c===lang?"sel":""}" data-l="${c}"><span class="flag">${f}</span>${n}<span class="ck">${c===lang?"✓":""}</span></button>`).join("");
 renderHome();}

// navigation
let stack=["welcome"];
function show(id,dir=1){if(id.startsWith("home:"))id="home";clearMsg();const cur=$(".screen.on");if(cur&&cur.id!==id){cur.classList.remove("on");cur.classList.toggle("left",dir>0);setTimeout(()=>cur.classList.remove("left"),400)}
 const n=$("#"+id);n.classList.remove("left");if(dir<0)n.classList.add("left");requestAnimationFrame(()=>{n.classList.remove("left");n.classList.add("on")});
 const f=n.querySelector("input");if(f&&id!=="otp")setTimeout(()=>f.focus(),380);}
function go(id){stack.push(id);H.push({id});show(id,1)}
function back(){if(stack.length>1){history.back()}}
function reset(id){stack=[id];show(id,-1)}
window.addEventListener("popstate",()=>{if(stack.length>1){stack.pop();show(stack[stack.length-1],-1)}});
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)go(g.dataset.go);if(e.target.closest("[data-back]"))back();
 const l=e.target.closest("[data-l]");if(l){lang=l.dataset.l;store.set("wraps.lang",lang);applyLang();if($("#home").classList.contains("on"))toast(t("langSaved"));else setTimeout(()=>{back();setTimeout(()=>toast(t("langSaved")),420)},300)}});

let tt;function toast(m,ms=3000){const scr=$(".screen.on:not(#splash)");if(!scr)return;const host=scr.id==="home"?$("#view"):(scr.id==="welcome"?$("#welcome .menu"):scr);document.querySelectorAll(".msg").forEach(x=>{if(x.parentNode!==host)x.remove()});let el=host.querySelector(":scope>.msg");if(!el){el=document.createElement("div");el.className="msg";host.appendChild(el)}el.textContent=m;el.classList.remove("on");void el.offsetWidth;el.classList.add("on");clearTimeout(tt);if(ms)tt=setTimeout(()=>el.classList.remove("on"),ms)}
function clearMsg(){clearTimeout(tt);document.querySelectorAll(".msg").forEach(x=>x.remove())}
function busy(btn,on){if(on){btn.dataset.lbl=btn.textContent;btn.innerHTML='<span class="spin"></span>';btn.disabled=true}else{btn.textContent=btn.dataset.lbl;btn.disabled=false}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// session
function login(name,method){clearMsg();store.set("wraps.session",{name,method,at:Date.now()});renderHome();stack=["home"];H.rep({id:"home"});show("home",1)}

// ===== APP SHELL: home grid, pages, tabbar =====
const IC={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 ajustes:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
 spots:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
 advance:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
 stats:'<path d="M3 21h18"/><rect x="5" y="11" width="3" height="7" rx="1"/><rect x="10.5" y="5" width="3" height="13" rx="1"/><rect x="16" y="14" width="3" height="4" rx="1"/>',
 personal:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-6 7-6s7 2.1 7 6"/><path d="M16 11l2 2 4-4"/>',
 api:'<path d="M4 8h14l-3-3"/><path d="M20 16H6l3 3"/>',
 hist:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>',
 rel:'<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/><path d="M9 13h8M9 17h6"/>',
 ia:'<path d="M11 3l1.8 4.7 4.7 1.8-4.7 1.8L11 16l-1.8-4.7L4.5 9.5l4.7-1.8z"/><path d="M18.5 14l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',
 perfil:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
 planos:'<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>',
 loja:'<path d="M5 8h14l-1.2 13H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>'
};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const GRID=[["ajustes","spots","advance"],["stats","personal","api"],["hist","rel","ia"],["perfil","planos","loja"]].flat();
const TABS=["home","ajustes","advance","spots","stats"];
const TKEY={home:"t_home",ajustes:"t_ajustes",spots:"t_spots",advance:"t_advance",stats:"t_stats",personal:"t_personal",api:"t_api",hist:"t_hist",rel:"t_rel",ia:"t_ia",perfil:"t_perfil",planos:"t_planos",loja:"t_loja"};
let curView="home";
$("#homeCards").innerHTML=document.querySelector("#welcome .cards").innerHTML;$("#spCards").innerHTML=document.querySelector("#welcome .cards").innerHTML;

function renderTabs(){$("#tabbar").innerHTML=TABS.map(k=>`<button class="tab ${k===curView?"on":""}" data-tab="${k}">${svg(k)}<span>${t(TKEY[k])}</span></button>`).join("")}
function renderView(){
 const v=$("#view");v.style.transform="";v.style.transition="";v.classList.remove("in","in-l","in-r");void v.offsetWidth;v.classList.add(slideDir>0?"in-l":slideDir<0?"in-r":"in");slideDir=0;
 if(curView==="home"){v.innerHTML=`<div class="grid">${GRID.map(k=>`<button class="tile" data-open="${k}">${svg(k)}<span>${t(TKEY[k])}</span></button>`).join("")}</div>`}
 else{
  let body="";
  if(curView==="perfil"){const se=store.get("wraps.session")||{};body=`<div class="pcard"><div class="av">${svg("perfil")}</div><b>${se.name||""}</b><small>${t("method")}: ${({quick:t("m2"),whats:"WhatsApp",sid:"StackUp ID"}[se.method]||"")}</small></div><button class="btn ghost" data-logout>${t("logout")}</button>`}
  else body=`<div class="soon"><div class="big">${svg(curView)}</div><span class="badge">${t("soon")}</span><p>${t("soonTxt")}</p></div>`;
  v.innerHTML=`<div class="pbody">${body}</div>`}
 $("#hdrTitle").textContent=t(TKEY[curView]);renderTabs()}
function setView(k,push=true){if(k===curView)return;
 if(k==="home"){curView="home";while(stack.length>1&&stack[stack.length-1].startsWith("home:")){stack.pop()}H.rep({id:"home"});}
 else{if(stack[stack.length-1].startsWith("home:")){stack[stack.length-1]="home:"+k;H.rep({id:"home:"+k})}else{stack.push("home:"+k);H.push({id:"home:"+k})}curView=k}
 renderView()}
window.addEventListener("popstate",()=>{const top=stack[stack.length-1]||"";const v=top.startsWith("home:")?top.slice(5):(top==="home"?"home":null);if(v&&v!==curView){curView=v;renderView()}});
document.addEventListener("click",e=>{const tb=e.target.closest("[data-tab]");if(tb){const a=TABS.indexOf(curView),b=TABS.indexOf(tb.dataset.tab);if(a>=0&&b>=0&&a!==b)slideDir=b>a?1:-1;setView(tb.dataset.tab)}
 const op=e.target.closest("[data-open]");if(op)setView(op.dataset.open);
 if(e.target.closest("[data-logout]")){store.del("wraps.session");curView="home";reset("welcome")}});

// ===== swipe between footer tabs =====
let slideDir=0;
(function(){const v=$("#view");let x0=0,y0=0,dx=0,drag=null;
 const idx=()=>{const i=TABS.indexOf(curView);return i<0?0:i};
 v.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;drag=null},{passive:true});
 v.addEventListener("touchmove",e=>{const x=e.touches[0].clientX,y=e.touches[0].clientY;
  if(drag===null){if(Math.abs(x-x0)<8&&Math.abs(y-y0)<8)return;drag=Math.abs(x-x0)>Math.abs(y-y0)}
  if(!drag)return;dx=x-x0;const i=idx();const edge=(dx>0&&i===0)||(dx<0&&i===TABS.length-1);
  v.style.transition="none";v.style.transform=`translateX(${edge?dx*.25:dx}px)`;v.style.opacity=String(1-Math.min(Math.abs(dx)/600,.35))},{passive:true});
 v.addEventListener("touchend",()=>{if(!drag){drag=null;return}const i=idx();const W=v.clientWidth;
  let to=null;if(dx<-60&&i<TABS.length-1)to=i+1;else if(dx>60&&i>0)to=i-1;
  if(to===null){v.style.transition="transform .25s ease,opacity .25s";v.style.transform="";v.style.opacity="";drag=null;return}
  v.style.transition="transform .18s ease-in,opacity .18s";v.style.transform=`translateX(${dx<0?-W:W}px)`;v.style.opacity="0";
  setTimeout(()=>{v.style.opacity="";slideDir=dx<0?1:-1;setView(TABS[to])},170);drag=null});
})();
function renderHome(){const s=store.get("wraps.session");if(!s)return;$("#hello").textContent=t("hi2")+" "+s.name;renderView()}

// quick access (biometria simulada; no app nativo usar plugin de biometria)
$("#bioBtn").onclick=async()=>{const b=$("#bioBtn");if(b.classList.contains("on"))return;b.classList.add("on");$("#bioTxt").textContent=t("bScan");
 await wait(1400);b.classList.remove("on");b.classList.add("ok");$("#bioTxt").textContent=t("bOk");if(navigator.vibrate)navigator.vibrate(40);
 await wait(600);b.classList.remove("ok");$("#bioTxt").textContent=t("bTap");login(t("bName"),"quick")};

// whatsapp
const phone=$("#phone");
phone.addEventListener("input",()=>{let d=phone.value.replace(/\D/g,"").slice(0,11);
 if($("#ddi").value==="55"){d=d.length>10?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length>6?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:d.length>2?`(${d.slice(0,2)}) ${d.slice(2)}`:d}
 phone.value=d;$("#wErr").textContent=""});
let otpCode="",timer;
async function sendCode(){otpCode=String(Math.floor(100000+Math.random()*900000));await wait(900);setTimeout(()=>{if($("#otp").classList.contains("on"))toast(t("demo")+" "+otpCode,0)},450);startTimer()}
function startTimer(){let s=30;clearInterval(timer);const r=$("#resend");const tick=()=>{if(s<=0){clearInterval(timer);r.innerHTML=`<button id="rs">${t("resend")}</button>`;$("#rs").onclick=()=>{r.innerHTML='<span class="spin"></span>';sendCode()}}else r.textContent=`${t("resendIn")} 0:${String(s).padStart(2,"0")}`;s--};tick();timer=setInterval(tick,1000)}
$("#wBtn").onclick=async()=>{const d=phone.value.replace(/\D/g,"");const min=$("#ddi").value==="55"?10:7;
 if(d.length<min){$("#wErr").textContent=t("phoneErr");return}
 busy($("#wBtn"),1);$("#otpPhone").textContent=`+${$("#ddi").value} ${phone.value}`;await sendCode();busy($("#wBtn"),0);buildOtp();go("otp");setTimeout(()=>$("#otpBox input").focus(),400)};
function buildOtp(){const b=$("#otpBox");b.innerHTML=Array(6).fill('<input inputmode="numeric" autocomplete="one-time-code">').join("");$("#oErr").textContent="";$("#oBtn").disabled=true;
 const ins=[...b.children];const code=()=>ins.map(i=>i.value).join("");
 ins.forEach((inp,i)=>{inp.addEventListener("input",()=>{const v=inp.value.replace(/\D/g,"");
   if(v.length>1){v.slice(0,6).split("").forEach((c,j)=>ins[j]&&(ins[j].value=c));ins[Math.min(v.length,5)].focus()}else{inp.value=v;if(v&&ins[i+1])ins[i+1].focus()}
   $("#oErr").textContent="";$("#oBtn").disabled=code().length<6;if(code().length===6)$("#oBtn").click()});
  inp.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!inp.value&&ins[i-1])ins[i-1].focus()})});}
$("#oBtn").onclick=async()=>{const ins=[...$("#otpBox").children];const c=ins.map(i=>i.value).join("");if(c.length<6)return;
 busy($("#oBtn"),1);await wait(700);busy($("#oBtn"),0);
 if(c!==otpCode){$("#oErr").textContent=t("codeErr");ins.forEach(i=>i.value="");ins[0].focus();$("#oBtn").disabled=true;if(navigator.vibrate)navigator.vibrate(120);return}
 clearInterval(timer);login("+"+$("#ddi").value+" •••• "+phone.value.replace(/\D/g,"").slice(-4),"whats")};

// stackup id
$("#eye").onclick=()=>{const p=$("#pass");const s=p.type==="password";p.type=s?"text":"password";$("#eye").textContent=t(s?"hide":"show")};
$("#forgot").onclick=()=>{const e=$("#email").value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){$("#sErr").textContent=t("emailErr");return}$("#sErr").textContent="";toast(t("forgotMsg"))};
$("#sBtn").onclick=async()=>{const e=$("#email").value.trim(),p=$("#pass").value;
 if(!/^\S+@\S+\.\S+$/.test(e)){$("#sErr").textContent=t("emailErr");return}if(p.length<6){$("#sErr").textContent=t("passErr");return}
 $("#sErr").textContent="";busy($("#sBtn"),1);await wait(900);busy($("#sBtn"),0);login(e.split("@")[0],"sid")};
$("#pass").addEventListener("keydown",e=>e.key==="Enter"&&$("#sBtn").click());

// boot
applyLang();H.rep({id:"welcome"});
setTimeout(()=>{const s=store.get("wraps.session");const first=s?"home":"welcome";stack=[first];
 const si=$("#splash .spIn");si.style.transition="opacity .35s ease,transform .35s ease";si.style.opacity=0;si.style.transform="scale(.94)";setTimeout(()=>{$("#splash").style.opacity=0;setTimeout(()=>$("#splash").classList.remove("on"),500);$("#"+first).classList.add("on")},320)},2300);
</script>
